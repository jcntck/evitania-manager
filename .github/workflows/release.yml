name: Verifiable platform releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version including v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Guard source and release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Record start
        run: echo "RELEASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out authorized branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Run complete preflight without pushing tags
        run: node scripts/release-preflight.mjs "${{ inputs.version }}"
      - name: Publish bounded source summary
        if: always()
        shell: bash
        run: |
          duration=$(($(date +%s)-RELEASE_STARTED))
          {
            echo "## Source preflight"
            echo "- Version: ${{ inputs.version }}"
            echo "- Duration: ${duration}s"
            echo "- Tag pushes during this job: 0"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Debian package, evidence, and packaged smoke
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Record start
        run: echo "PLATFORM_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Debian distribution and exact evidence
        run: npm run dist:linux
      - name: Inspect evidence contract
        shell: bash
        run: |
          node scripts/validate-release.mjs --platform linux --directory release/linux/publish
          artifact=$(find "$GITHUB_WORKSPACE/release/linux/publish" -maxdepth 1 -type f -name '*.deb')
          echo "EVITANIA_PACKAGED_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Install Debian package
        run: sudo apt-get install -y ./release/linux/publish/*.deb
      - name: Smoke installed application with isolated persistence
        env:
          EVITANIA_PACKAGED_EXECUTABLE: /usr/bin/evitania-manager
          EVITANIA_PACKAGED_PLATFORM: linux
        run: xvfb-run --auto-servernum npx playwright test e2e/distribution.spec.ts
      - name: Attest Debian package and exact ZIP
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            release/linux/publish/*.deb
            release/linux/publish/*.deb.zip
      - name: Upload isolated Linux release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-linux
          path: release/linux/publish/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish bounded Linux summary
        if: always()
        shell: bash
        run: |
          duration=$(($(date +%s)-PLATFORM_STARTED))
          {
            echo "## Linux platform"
            echo "- Duration: ${duration}s"
            echo "- Inventory:"
            find release/linux/publish -maxdepth 1 -type f -printf '  - %f\n' 2>/dev/null | sort
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: NSIS package, evidence, signing, and packaged smoke
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Record start
        shell: pwsh
        run: '"PLATFORM_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build NSIS distribution and exact evidence
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:windows
      - name: Inspect evidence contract
        shell: pwsh
        run: |
          node scripts/validate-release.mjs --platform windows --directory release/windows/publish
          $artifact = (Get-ChildItem release/windows/publish/*.exe).FullName
          "EVITANIA_PACKAGED_ARTIFACT=$artifact" >> $env:GITHUB_ENV
          "EVITANIA_PACKAGED_EVIDENCE=$((Resolve-Path release/windows/publish).Path)" >> $env:GITHUB_ENV
      - name: Install NSIS package in isolated location
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/windows/publish/*.exe).FullName
          $install = Join-Path $env:RUNNER_TEMP EvitaniaInstalled
          Start-Process -FilePath $installer -ArgumentList '/S',("/D=$install") -Wait
          "EVITANIA_PACKAGED_EXECUTABLE=$(Join-Path $install 'Evitania Manager.exe')" >> $env:GITHUB_ENV
      - name: Smoke installed application with isolated persistence
        env:
          EVITANIA_PACKAGED_PLATFORM: windows
        run: npx playwright test e2e/distribution.spec.ts
      - name: Attest NSIS installer and exact ZIP
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            release/windows/publish/*.exe
            release/windows/publish/*.exe.zip
      - name: Upload isolated Windows release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-windows
          path: release/windows/publish/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish bounded Windows summary
        if: always()
        shell: pwsh
        run: |
          $duration = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:PLATFORM_STARTED
          "## Windows platform`n- Duration: ${duration}s`n- Inventory:" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem release/windows/publish -File | Sort-Object Name |
            ForEach-Object { "  - $($_.Name)" >> $env:GITHUB_STEP_SUMMARY }

  publish:
    name: Publish immutable Linux, Windows, then source topology
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Record start
        run: echo "PUBLISH_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Download Linux evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-linux
          path: release/linux/publish
      - name: Download Windows evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-windows
          path: release/windows/publish
      - name: Reconcile both platform inventories
        run: |
          node scripts/validate-release.mjs --platform linux --directory release/linux/publish
          node scripts/validate-release.mjs --platform windows --directory release/windows/publish
      - name: Publish immutable three-tag topology
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --version "${{ inputs.version }}"
      - name: Publish bounded topology summary
        if: always()
        shell: bash
        run: |
          duration=$(($(date +%s)-PUBLISH_STARTED))
          {
            echo "## Publication topology"
            echo "- Order: ${{ inputs.version }}-linux → ${{ inputs.version }}-windows → ${{ inputs.version }}"
            echo "- Duration: ${duration}s"
            echo "- Main release created only after both platform releases."
          } >> "$GITHUB_STEP_SUMMARY"
