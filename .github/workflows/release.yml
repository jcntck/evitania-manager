name: Release builds

on:
  push:
    tags:
      - 'v*-linux'
      - 'v*-windows'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ endsWith(github.ref_name, '-windows') && 'Windows' || 'Linux' }}
    runs-on: ${{ endsWith(github.ref_name, '-windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm test && npm run typecheck && npm audit --omit=dev

      - name: Build Linux artifacts
        if: endsWith(github.ref_name, '-linux')
        run: npm run dist:linux

      - name: Build Windows artifacts
        if: endsWith(github.ref_name, '-windows')
        run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Generate checksums and SBOM
        run: node scripts/release-metadata.mjs

      - name: Attest Linux artifacts
        if: endsWith(github.ref_name, '-linux')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            release/*.AppImage
            release/*.zip

      - name: Attest Windows artifacts
        if: endsWith(github.ref_name, '-windows')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            release/*.exe
            release/*.zip

      - name: Publish platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --verify-tag --generate-notes --title "Evitania Manager ${GITHUB_REF_NAME}"
